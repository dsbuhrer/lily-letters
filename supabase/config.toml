# Local Supabase Auth — require email confirmation before full customer access.
# Hosted projects: Dashboard → Authentication → Providers → Email → Confirm email.
[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/account", "http://127.0.0.1:5173/account/reset-password"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.create-order]
verify_jwt = false

[functions.complete-order-payment]
verify_jwt = false

[functions.get-order-confirmation]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.generate-post-seo]
verify_jwt = true

[functions.refund-order]
verify_jwt = true

[functions.trigger-rebuild]
verify_jwt = false

[functions.submit-contact]
verify_jwt = false
